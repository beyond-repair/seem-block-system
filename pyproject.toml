[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seem-block-system"
version = "0.1.0"
description = "Claim-0 NumPy monitors for the SEEM Block-System Isolation Theorem (C=0, I1–I4). SUPERSEDED archive; successor sovereign-clean-room. Not AGI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brian Ware" }]
dependencies = [
  "numpy>=1.25,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
seem-block-system = "seem_block_system.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seem_block_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
